name: Android-Test-APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK installieren
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android APK erstellen
        run: gradle --no-daemon :app:assembleDebug

      - name: Fertige APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Drohnengruppe-0.6-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
