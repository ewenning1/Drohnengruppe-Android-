<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Drohnengruppe 0.9</title><style>
:root{--navy:#111b2d;--blue:#1d67e9;--paper:#f3f6fb;--ink:#162134;--muted:#708098;--border:#e2e8f1;--red:#c43838;--green:#087e55}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:16px system-ui,-apple-system,Roboto,sans-serif;background:var(--paper);color:var(--ink)}header{padding:26px 18px 18px;background:var(--navy);color:#fff}header small{color:#aabbd5;font-size:12px;letter-spacing:1px;font-weight:700}header h1{font-size:24px;margin:7px 0 0}header p{color:#aabbd5;margin:7px 0 0;font-size:13px}main{max-width:760px;margin:auto;padding:16px 14px 90px}.panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:17px;margin:0 0 14px;box-shadow:0 2px 8px #18305c08}.flex{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.muted{color:var(--muted)}.micro{font-size:12px}.title{font-size:18px;font-weight:750;margin:0 0 12px}.top{display:flex;gap:9px;align-items:center;margin-bottom:15px}button{border:0;background:var(--blue);color:#fff;border-radius:11px;font:600 15px system-ui;padding:13px 16px;min-height:46px;cursor:pointer}button.secondary{background:#edf2fb;color:var(--navy)}button.outline{background:#fff;color:var(--blue);border:1px solid var(--blue)}button.danger{background:#b82e3f}button:disabled{opacity:.45}.full{width:100%;margin:6px 0}.navitem{background:white;color:var(--ink);padding:19px;border-radius:14px;border:1px solid var(--border);margin-bottom:11px;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font-size:17px}.navitem span{font-weight:750}.navitem small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.pill{display:inline-block;padding:5px 8px;background:#eef3ff;color:#184ea5;border-radius:999px;font-size:12px;font-weight:650}.pill.on{background:#e4f8ed;color:#0b7951}.pill.done{background:#eee;color:#555}input,select,textarea{background:white;color:var(--ink);border:1px solid #c9d4e1;border-radius:9px;padding:12px;width:100%;font:16px system-ui;min-height:44px}textarea{min-height:70px}label{display:block;font-size:13px;font-weight:650;color:#40506a;margin:14px 0 5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rowitem{border-bottom:1px solid var(--border);padding:11px 0}.rowitem:last-child{border-bottom:0}.number{font-variant-numeric:tabular-nums;font-size:38px;font-weight:750;letter-spacing:-1px}hr{border:none;border-top:1px solid var(--border);margin:18px 0}.hint{font-size:12px;color:var(--muted);line-height:1.5}.warning{border:1px solid #f8d7a9;background:#fff8ec;border-radius:12px;padding:12px;margin:12px 0;font-size:13px}.fail{color:#ac2d3d;font-weight:600}.notice{background:#e8f6ed;padding:12px;border-radius:12px;color:#1c6748;margin:10px 0}.right{text-align:right}h3{font-size:17px}.modalback{position:fixed;inset:0;z-index:99;background:#101827ae;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:white;padding:20px;border-radius:17px;max-width:430px;width:100%;max-height:88vh;overflow-y:auto}.list-btn{border:1px solid #dce4ef;background:#f5f8fd;color:#25334a;padding:10px;margin:4px;border-radius:10px;min-height:38px}.tag{display:inline-block;background:#e7eef8;border-radius:8px;padding:4px 7px;font-size:12px;margin:3px}.smallbtn{font-size:13px;padding:8px 10px;min-height:34px}.dashboardstat{display:flex;gap:10px}.dashboardstat div{flex:1;background:#f2f6fc;border-radius:11px;padding:10px;text-align:center}.dashboardstat strong{display:block;font-size:21px}footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dfe7f0;display:flex;z-index:10;justify-content:space-around;padding:8px 2px calc(8px + env(safe-area-inset-bottom))}footer button{min-height:43px;background:white;color:#38506d;font-size:12px;font-weight:650;padding:6px 12px}footer button.sel{background:#e5efff;color:#1257c8}#toast{position:fixed;bottom:80px;left:16px;right:16px;max-width:650px;margin:auto;z-index:101;background:#24334b;color:white;border-radius:12px;padding:14px;display:none;text-align:center;font-size:14px}

.bigcount{font-variant-numeric:tabular-nums;font-size:58px;font-weight:850;line-height:1.15;text-align:center;letter-spacing:-2px;padding:15px 5px;border-radius:14px;color:#087e55;background:#e8f7ef}
.bigcount.yellow{color:#8c5e00;background:#fff2bc}.bigcount.red{color:#b22436;background:#ffe4e6}.smalltime{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.liveitem{padding:13px 2px;border-bottom:1px solid #dfe7f0}.liveitem:last-child{border:0}.liveitem .remain{font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}.liveitem.yellow .remain{color:#9b7100}.liveitem.red .remain{color:#b22436}.liveitem.green .remain{color:#087e55}
.liveitem{padding:19px 0}.liveitem .drone-name{font-size:27px;line-height:1.15;letter-spacing:-.4px}.liveitem .remain{font-size:40px;letter-spacing:-1px;line-height:1.05}.liveitem .flight-clock{display:block;font-size:12px;margin-top:7px;color:var(--muted);font-variant-numeric:tabular-nums}.liveitem .muted{font-size:12px}.operation-summary{padding:11px 13px}.operation-summary .dashboardstat div{padding:6px}.operation-summary .dashboardstat strong{font-size:16px}.operation-summary p{margin:5px 0}.operation-summary .pill{font-size:10px}.qual{font-size:12px;color:var(--muted)}.chartbox{width:100%;background:#f8faff;border-radius:12px;overflow:hidden;margin:8px 0 14px}.crew-menu{padding:7px 11px;border:1px solid var(--border);border-radius:9px;background:#f9fbff;margin-top:5px}.crew-option{display:flex;align-items:center;gap:9px;font-size:14px;padding:7px 2px;margin:0;font-weight:400}.crew-option input{width:19px;height:19px;min-height:19px}.flight-drone-header{font-size:32px;font-weight:800;line-height:1.15}.reading-drone{font-size:29px;font-weight:800;color:#162134;margin:14px 0 4px}.mapthumb{height:205px;position:relative;overflow:hidden;border-radius:12px;background:#dbe8f1;border:1px solid #b7c8d8}.mapthumb img{width:256px;height:256px;position:absolute;max-width:none}.mappin{position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);font-size:30px;text-shadow:0 0 3px #fff}.mapcredit{position:absolute;bottom:3px;right:4px;background:#ffffffd9;padding:2px 4px;border-radius:3px;font-size:9px;color:#41536b}.pillqual{display:inline-block;margin:4px 4px 4px 0;padding:4px 7px;background:#eef3ff;border-radius:8px;font-size:12px}

</style></head><body><header><img src="logo.svg" alt="Logo Drohnengruppe" class="brand-logo"><small>FEUERWEHR · DROHNENGRUPPE</small><h1 id="pageTitle">Flugdokumentation</h1><p id="pageSub">Version 0.9 · GPS · Karte · Berichte</p></header><main id="main"></main><div id="flightBackDock" hidden><button class="secondary" type="button" onclick="go('operation')">← Abbrechen · Zur Einsatzübersicht</button></div><footer><button onclick="go('home')" id="nav-home">⌂ Start</button><button onclick="go('history')" id="nav-history">▤ Daten</button><button onclick="go('settings')" id="nav-settings">⚙ Einstellungen</button></footer><div id="toast"></div><div id="modalroot"></div>
<script>
'use strict';
const KEY='drohnengruppe_app_v1';const initial={people:[],drones:[],operations:[],pin:'112',audit:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){db=structuredClone(initial)}
for(const k of Object.keys(initial))if(db[k]===undefined)db[k]=structuredClone(initial[k]);
let view='home',current=null,flightId=null,editActor='',activeTab='people',gpsFix=null;const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now(),rand=()=>Math.random().toString(36).slice(2,10),dt=t=>t?new Date(t).toLocaleString('de-DE'):'—',tm=t=>t?new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'—';
const duration=(a,b)=>{const s=Math.max(0,Math.floor(((b||now())-a)/1000));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')};
const flightMinutes=(a,b)=>{if(!a)return '—';const seconds=Math.max(0,Math.floor(((b||now())-a)/1000));return (seconds/60).toFixed(2).replace('.',',')+' Min.'};
const minutesCsv=(a,b)=>{const seconds=Math.max(0,Math.floor((b-a)/1000));return (seconds/60).toFixed(2).replace('.',',')};
const flightOffset=(f,t)=>{const seconds=Math.max(0,Math.floor((Number(t)-Number(f.startedAt))/1000));return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')};
const gpsLabel=o=>Number.isFinite(Number(o.gpsLat))&&Number.isFinite(Number(o.gpsLon))&&o.gpsLat!==null&&o.gpsLon!==null&&o.gpsLat!==undefined&&o.gpsLon!==undefined?Number(o.gpsLat).toFixed(6)+', '+Number(o.gpsLon).toFixed(6):'—';
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));syncNativeReminders();return true}catch(e){toast('Speichern fehlgeschlagen: '+e.message);return false}}
function syncNativeReminders(){if(!window.NativeBridge)return;try{for(const o of db.operations)for(const f of o.flights){if(f.endedAt||o.endedAt)NativeBridge.cancelReminder(String(f.id));else NativeBridge.scheduleReminder(String(f.id),'🚁 '+String(f.droneName)+' · Akku '+String(f.battery)+' – bitte Akkustand erfassen',Math.floor(readingDue(f)));}}catch(e){console.warn('Hintergrund-Erinnerung',e)}}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3800)}
function modal(markup){$('modalroot').innerHTML='<div class="modalback"><div class="modal">'+markup+'</div></div>'}
function closeModal(){$('modalroot').innerHTML='';if(window.activeReminderKey){window.reminderUntil[window.activeReminderKey]=now()+60000;window.activeReminderKey='';}window.readingTarget=null;}
function confirmPin(next,who=false){modal(`<h3>🔒 Sicherheitsabfrage</h3><p class="hint">Bitte PIN eingeben. Standard: 112. Bei Änderungen wird die bearbeitende Person erfasst.</p><label>PIN</label><input type="password" id="pinIn" inputmode="numeric">${who?`<label>Bearbeitende Person</label><select id="actor">${peopleOptions()}</select><label>Bemerkung (optional)</label><input id="reason" placeholder="Warum geändert?">`:''}<div class="grid2" style="margin-top:20px"><button class="secondary" onclick="closeModal()">Abbrechen</button><button onclick="pinConfirm(${who?'true':'false'})">Bestätigen</button></div>`);window.pendingPin=next}
function pinConfirm(who){if($('pinIn').value!==db.pin){toast('PIN falsch');return}const person=who?$('actor').value:'';if(who&&!person){toast('Person auswählen');return}const note=who?$('reason').value:'';closeModal();window.pendingPin(person,note)}
function audit(type,op,person,note,before,after){db.audit.push({type,op,time:now(),person,note,before,after});save()}
function opById(id){return db.operations.find(x=>x.id===id)}function flightById(op,id){return op.flights.find(x=>x.id===id)}
function peopleOptions(selected=''){return `<option value="">Bitte wählen</option>`+db.people.filter(x=>x.active!==false).map(x=>`<option ${selected===x.name?'selected':''} value="${esc(x.name)}">${esc(x.name)}</option>`).join('')}
function droneOptions(){return db.drones.filter(x=>x.active!==false).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}
function setTitle(title,subtitle=''){ $('pageTitle').textContent=title; $('pageSub').textContent=subtitle }
function go(v){view=v;render()}
window.handleAndroidBack=function(){if($('modalroot').firstElementChild){closeModal();return true}const target={newflight:'operation',flight:'operation',oldflights:'operation',report:'operation',operation:'home',newop:'home',history:'home',analytics:'history',settings:'home',export:'history',detail:'history'}[view];if(!target)return false;go(target);return true};
function render(){const el=$('main');const dock=$('flightBackDock');if(dock)dock.hidden=view!=='newflight';el.classList.toggle('prepare-active',view==='newflight');document.querySelectorAll('footer button').forEach(b=>b.classList.toggle('sel',b.id==='nav-'+view));if(view==='home')return home(el);if(view==='newop')return newop(el);if(view==='operation')return operation(el);if(view==='oldflights')return oldflights(el);if(view==='report')return reportview(el);if(view==='newflight')return newflight(el);if(view==='flight')return liveflight(el);if(view==='history')return history(el);if(view==='analytics')return batteryAnalytics(el);if(view==='detail')return detail(el);if(view==='settings')return settings(el);if(view==='export')return exportscreen(el)}
function home(el){setTitle('Flugdokumentation','Einsatz · Übung · Flugbuch');const active=db.operations.filter(x=>!x.endedAt);el.innerHTML=`<div class="panel"><div class="dashboardstat"><div><strong>${active.length}</strong><span class="micro muted">Aktive Einsätze/Übungen</span></div></div></div><button class="navitem" onclick="newOperation('Einsatz')"><div><span>🚒 Neuer Einsatz</span><small>Einsatzdaten und Flüge dokumentieren</small></div>›</button><button class="navitem" onclick="newOperation('Übung')"><div><span>🛩 Neuer Übungsdienst</span><small>Trainingsflüge und Akkuwerte erfassen</small></div>›</button><button class="navitem" onclick="go('history')"><div><span>▤ Daten einsehen</span><small>Protokolle, Auswertungen und Export</small></div>›</button>${active.length?`<h3>Laufende Einsätze / Übungen</h3>${active.map(o=>`<div class="panel"><div class="flex between"><strong>${esc(o.type)} · ${esc(o.name||o.place||'Ohne Bezeichnung')}</strong><span class="pill on">Läuft</span></div><p class="micro muted">Beginn ${dt(o.startedAt)}</p><button class="full" onclick="openOp('${o.id}')">Fortsetzen ›</button></div>`).join('')}`:''}<p class="hint">Testversion: Daten nur lokal, regelmäßig sichern. Akku-Popup erscheint bei geöffneter App; Hintergrund-Erinnerungen können sich durch Android verzögern.</p>`}
function newOperation(type){current=null;gpsFix=null;window.newType=type;go('newop')}
function newop(el){setTitle('Neuer '+window.newType,'Einsatz oder Übung anlegen');el.innerHTML=`<div class="panel"><label>Bezeichnung / Einsatznummer (optional)</label><input id="opname" placeholder="z. B. Einsatz 2026-15"><label>Einsatzadresse (Straße, Hausnummer, PLZ, Ort)</label><input id="place" placeholder="z. B. Hauptstraße 12, 31241 Ilsede"><button class="secondary full" onclick="getPosition()">📍 GPS-Standort und Adresse ermitteln</button><p id="gpsstatus" class="hint">GPS-Position abrufen und Adresse vorschlagen lassen. Adresse bitte kontrollieren.</p><p id="gpsaddress" class="hint"><strong>📍 Adresse: noch nicht ermittelt</strong></p><p id="gpscoords" class="hint">GPS-Koordinaten: noch nicht ermittelt</p><div id="gpsmap" style="margin:12px 0"></div><label>Temperatur (°C, optional)</label><input id="temp" type="number" step="0.1" placeholder="z. B. 12"><button class="secondary full" onclick="getTemperature()">🌡 Temperatur zum Standort ermitteln</button><p id="tempstatus" class="hint">Wetterabfrage benötigt GPS-Koordinaten und eine Internetverbindung.</p><label>Alarmierungszeit (optional)</label><input id="alarm" type="time"><label>Gruppenführer (optional)</label><select id="leader">${peopleOptions()}</select><label>Protokollführer für diesen Einsatz (optional)</label><select id="recorder">${peopleOptions()}</select><label>Lademanagement (optional)</label><select id="charger">${peopleOptions()}</select><label>Weitere Besatzung (Mehrfachauswahl, freiwillig)</label><details class="crew-menu" id="crewDetails"><summary id="crewSummary">Besatzung auswählen</summary><div>${db.people.filter(x=>x.active!==false).map(person=>`<label class="crew-option"><input type="checkbox" class="crew-select" value="${esc(person.name)}" onchange="updateCrewSummary()">${esc(person.name)}</label>`).join('')||'<span class="hint">Noch kein Personal hinterlegt.</span>'}</div></details><label>Zusätzliche Namen/Funktionen (optional)</label><input id="crewExtra" placeholder="Weitere Kräfte oder Funktionen"><label>Bemerkungen (optional)</label><textarea id="opnote"></textarea><button class="full" onclick="saveOp()">${window.newType} starten</button></div>`}
function updateCrewSummary(){const names=[...document.querySelectorAll('.crew-select:checked')].map(x=>x.value);const t=$('crewSummary');if(t)t.textContent=names.length?`${names.length} Personen ausgewählt: ${names.join(', ')}`:'Besatzung auswählen'}
function saveOp(){const selected=[...document.querySelectorAll('.crew-select:checked')].map(x=>x.value);const additional=$('crewExtra').value.trim();const o={id:rand(),type:window.newType,name:$('opname').value.trim(),place:$('place').value.trim(),gpsLat:gpsFix?.lat??null,gpsLon:gpsFix?.lon??null,temp:$('temp').value,alarm:$('alarm').value,leader:$('leader').value,recorder:$('recorder').value,charger:$('charger').value,crew:[...selected,...(additional?[additional]:[])].join(', '),note:$('opnote').value,startedAt:now(),endedAt:null,flights:[]};db.operations.unshift(o);save();current=o.id;go('operation')}
function openOp(id){current=id;go('operation')}
function operation(el){const o=opById(current);if(!o)return go('home');setTitle(o.type+' · Übersicht',o.place||'Ort nicht angegeben');const inflight=o.flights.filter(f=>!f.endedAt);el.innerHTML=`<div class="panel operation-summary"><div class="flex between"><strong>${esc(o.name||o.type)}</strong><span class="pill ${o.endedAt?'done':'on'}">${o.endedAt?'Abgeschlossen':'Laufend'}</span></div><p class="micro muted">Beginn: ${dt(o.startedAt)}${o.endedAt?' · Ende: '+dt(o.endedAt):''}</p><div class="dashboardstat"><div><strong>${o.flights.length}</strong><span class="micro muted">Flüge insgesamt</span></div><div><strong>${inflight.length}</strong><span class="micro muted">In der Luft</span></div></div>${o.place||gpsLabel(o)!=='—'?`<p class="micro muted">📍 ${esc(o.place||'Adresse nicht angegeben')}</p>${gpsLabel(o)!=='—'?`<p class="micro muted">GPS: ${esc(gpsLabel(o))}</p>`:''}${mapSnippet(gpsLabel(o)!=='—'?gpsLabel(o):o.place)}`:''}</div>${inflight.length?`<div class="panel"><h3>🛩 Drohnen in der Luft</h3>${inflight.map(f=>{let status=dueInfo(f);return `<div class="liveitem ${status.color}" onclick="openFlight('${f.id}')"><div class="flex between"><strong class="drone-name">${esc(f.droneName)}</strong><div class="right"><span class="remain" id="due-${f.id}">${status.text}</span><span class="flight-clock" id="flight-${f.id}">Flugzeit ${duration(f.startedAt)}</span></div></div><small class="muted">Nächste Akkuabfrage · Akku ${esc(f.battery)} · Pilot ${esc(f.pilot)}</small></div>`}).join('')}</div>`:''}${!o.endedAt?`<button class="full" onclick="go('newflight')">＋ Neuen Flug starten</button>`:''}<button class="secondary full" onclick="go('oldflights')">▤ Alte Flüge / Flugprotokolle (${o.flights.filter(f=>f.endedAt).length})</button><button class="outline full" onclick="go('report')">📄 Gesamtbericht · PDF / CSV / Diagramme</button><button class="secondary full" onclick="editOperation()">✎ Einsatzdaten bearbeiten · PIN</button>${!o.endedAt?`<button class="danger full" onclick="endOperation()" ${inflight.length?'disabled':''}>Einsatz / Übung abschließen · PIN</button>`:''}<button class="secondary full" onclick="go('history')">Alle Protokolle</button>`}

function getPosition(){const target=$('gpsstatus');if(target)target.textContent='Android fragt den Standort ab. Bitte Standortberechtigung erlauben …';if(window.NativeBridge&&typeof NativeBridge.getLocation==='function'){try{NativeBridge.getLocation();return}catch(e){if(target)target.textContent='Android-Standortfehler: '+e.message}}if(!navigator.geolocation){if(target)target.textContent='GPS benötigt die native Android-App.';return}navigator.geolocation.getCurrentPosition(p=>nativeGps(p.coords.latitude,p.coords.longitude),e=>{if(target)target.textContent='GPS nicht verfügbar: '+e.message},{enableHighAccuracy:true,timeout:20000})}
window.nativeGps=function(lat,lon){
 if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
 gpsFix={lat,lon};
 const coord=lat.toFixed(6)+', '+lon.toFixed(6);
 const coords=$('gpscoords');if(coords)coords.textContent='GPS-Koordinaten: '+coord;const displayAddress=$('gpsaddress');if(displayAddress)displayAddress.textContent='📍 Adresse: wird ermittelt …';
 const status=$('gpsstatus');if(status)status.textContent='✓ GPS gespeichert. Adresse wird ermittelt …';
 const map=$('gpsmap');if(map)map.innerHTML=mapSnippet(coord);
 if($('temp'))getTemperature();
};
window.nativeAddress=function(address,lat,lon){
 if(!gpsFix||Math.abs(gpsFix.lat-lat)>0.00001||Math.abs(gpsFix.lon-lon)>0.00001)return;
 const suggested=String(address||'').trim();const displayAddress=$('gpsaddress');if(displayAddress)displayAddress.textContent=suggested?'📍 Adresse: '+suggested:'📍 Adresse: nicht gefunden – bitte manuell eingeben';const inp=$('place');if(inp&&!inp.value.trim()&&suggested)inp.value=suggested;
 const status=$('gpsstatus');if(status)status.textContent=address?'✓ Adresse vorgeschlagen – Straße und Hausnummer bitte prüfen.':'Keine Adresse gefunden. Bitte manuell eintragen.';
};
window.nativeAddressUnavailable=function(){
 const address=$('gpsaddress');if(address)address.textContent='📍 Adresse: nicht verfügbar – bitte oben manuell eintragen';
 const status=$('gpsstatus');if(status)status.textContent='GPS gespeichert. Adresse nicht verfügbar – bitte manuell eintragen.';
};
function mapSnippet(place){const m=String(place||'').match(/(-?\d{1,2}(?:\.\d+)?)\s*[,; ]\s*(-?\d{1,3}(?:\.\d+)?)/);if(!m)return '';const lat=Number(m[1]),lon=Number(m[2]);if(!(Math.abs(lat)<=85&&Math.abs(lon)<=180))return '';const z=14,n=2**z,x=(lon+180)/360*n,y=(1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*n;let tiles='';for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const xx=Math.floor(x)+dx,yy=Math.floor(y)+dy;const left=150+Math.round((xx-x)*256),top=102+Math.round((yy-y)*256);tiles+=`<img alt="" loading="lazy" style="left:${left}px;top:${top}px" src="https://tile.openstreetmap.org/${z}/${xx}/${yy}.png">`}return `<div class="mapthumb">${tiles}<div class="mappin">📍</div><span class="mapcredit">© OpenStreetMap-Mitwirkende</span></div><p class="micro muted">Standort: ${esc(lat.toFixed(6)+', '+lon.toFixed(6))} · Kartenausschnitt benötigt Internet</p>`}

async function getTemperature(){
 const status=$('tempstatus'),place=$('place')?.value.trim()||'';
 const m=place.match(/(-?\d{1,2}(?:\.\d+)?)\s*[,; ]\s*(-?\d{1,3}(?:\.\d+)?)/);
 if(!gpsFix&&!m){if(status)status.textContent='Automatische Temperatur benötigt GPS oder Koordinaten. Sonst bitte manuell eingeben.';return}
 const lat=gpsFix?gpsFix.lat:Number(m[1]),lon=gpsFix?gpsFix.lon:Number(m[2]);
 if(Math.abs(lat)>90||Math.abs(lon)>180){if(status)status.textContent='Ungültige Koordinaten';return}
 if(status)status.textContent='Temperatur wird ermittelt …';
 if(window.NativeBridge&&typeof NativeBridge.getTemperature==='function'){try{NativeBridge.getTemperature(lat,lon);return}catch(e){console.warn('Native Wetterabfrage',e)}}
 try{const url='https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(lat)+'&longitude='+encodeURIComponent(lon)+'&current=temperature_2m';const res=await fetch(url);if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();const t=data?.current?.temperature_2m;if(typeof t!=='number')throw Error('Keine Temperaturdaten');$('temp').value=t;if(status)status.textContent='Wetterdienst Open-Meteo: '+t+' °C. Kann manuell geändert werden.'}catch(e){if(status)status.textContent='Wetterdienst nicht erreichbar; Temperatur bitte manuell eintragen ('+e.message+').'}
}

e="float:right">${x.battery}%</strong></div>`).join('')}<p class="hint">Fernbedienung Ende: ${f.endRc===null?'Noch nicht erfasst':f.endRc+'%'}</p>${f.changes.length?'<h3>Besatzungswechsel</h3>'+f.changes.map(c=>`<p class="micro">${dt(c.time)} · ${esc(c.pilot)} / ${esc(c.copilot||'—')}</p>`).join(''):''}${f.note?`<p>${esc(f.note)}</p>`:''}</div><button class="secondary full" onclick="go('operation')">← Einsatzübersicht</button>`}

ck="editDrone('${d.id}')">Bearbeiten</button></div><p class="hint">Intervall ${d.interval} Min · Akkus: ${d.batteries.map(esc).join(', ')} · ${d.active===false?'Inaktiv':'Aktiv'}</p></div>`).join('')}`:`<h3>Einsatz-PIN ändern</h3><p class="hint">Die PIN schützt vor versehentlichen Abschlüssen und Änderungen, ersetzt aber keine Zugriffskontrolle.</p><label>Aktuelle PIN</label><input id="oldPin" type="password" inputmode="numeric"><label>Neue PIN</label><input id="newPin" type="password" inputmode="numeric"><button class="full" onclick="changePin()">PIN ändern</button>`}</div><div class="warning">Testversion: Daten bleiben lokal auf diesem Gerät. Bei Updates vorab ein Backup sichern; für Einsätze ist die App noch nicht freigegeben.</div>`}
function pilotMillis(name){let ms=0;for(const o of db.operations)for(const f of o.flights){if(!f.endedAt)continue;const changes=[...(f.changes||[])].sort((a,b)=>a.time-b.time);let pilot=f.initialPilot||((changes[0]&&changes[0].previousPilot)||f.pilot),start=f.startedAt;for(const c of changes){const end=Math.max(start,Math.min(f.endedAt,c.time));if(pilot===name)ms+=end-start;start=end;pilot=c.pilot||pilot}if(pilot===name)ms+=Math.max(0,f.endedAt-start)}return ms}
function pilotTime(name){const seconds=Math.floor(pilotMillis(name)/1000);return String(Math.floor(seconds/3600)).padStart(2,'0')+':'+String(Math.floor((seconds%3600)/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}

function editDrone(id){const d=db.drones.find(x=>x.id===id);modal(`<h3>${esc(d.name)}</h3><label>Bezeichnung</label><input id="edName" value="${esc(d.name)}"><label>Intervall (Min.)</label><input id="edInterval" type="number" value="${d.interval}"><label>Akkunummern (Komma-getrennt)</label><input id="edBats" value="${esc(d.batteries.join(', '))}"><label>Akku-Seriennummern (je Zeile: Nummer = Seriennummer)</label><textarea id="edSerials" rows="4" placeholder="1 = Seriennummer">${esc(d.batteries.map(n=>n+" = "+(d.batterySerials?.[n]||"")).join("\n"))}</textarea><label>Status</label><select id="edActive"><option ${d.active!==false?'selected':''} value="1">Aktiv</option><option ${d.active===false?'selected':''} value="0">Inaktiv</option></select><div class="grid2" style="margin-top:15px"><button class="secondary" onclick="closeModal()">Abbrechen</button><button onclick="saveDrone('${id}')">Speichern</button></div>`)}
function saveDrone(id){const d=db.drones.find(x=>x.id===id),n=$('edName').value.trim(),i=Number($('edInterval').value),b=$('edBats').value.split(',').map(x=>x.trim()).filter(Boolean);if(!n||!Number.isInteger(i)||i<1||i>180||!b.length||new Set(b).size!==b.length)return toast('Eingaben prüfen');d.name=n;d.interval=i;d.batteries=b;const serials={};for(const line of $('edSerials').value.split(/\r?\n/)){if(!line.trim())continue;const at=line.indexOf('=');if(at<0)continue;const key=line.slice(0,at).trim(),value=line.slice(at+1).trim();if(key&&value&&b.includes(key))serials[key]=value}const used=Object.values(serials);if(new Set(used).size!==used.length)return toast('Seriennummern müssen eindeutig sein');d.batterySerials=serials;d.active=$('edActive').value==='1';save();closeModal();render()}
function changePin(){if($('oldPin').value!==db.pin)return toast('Aktuelle PIN falsch');const n=$('newPin').value;if(!/^\d{3,8}$/.test(n))return toast('Bitte 3 bis 8 Ziffern wählen');db.pin=n;save();render();toast('PIN geändert')}

// Kleine lokale PDF-Erzeugung ohne Internet/CDN; mehrseitiger Textbericht mit allen Flügen.
function makePdf(lines){const paper=595, height=842, margin=38, maxWidth=105;let pages=[[]],y=height-45;function norm(s){return String(s??'').replace(/[\r\n]+/g,' ').replace(/[\t]+/g,' ').replace(/[\u2013\u2014]/g,'-').replace(/[\u2022]/g,'*').replace(/[^\x20-\xFF]/g,'?')}
function pdfstr(s){let out='';for(const ch of norm(s)){const n=ch.charCodeAt(0);out+=n===40||n===41||n===92?'\\'+ch:ch}return out}
for(const line of lines){const val=norm(line);const parts=val.match(/.{1,95}(?:\s|$)|\S{1,95}/g)||[''];for(let seg of parts){seg=seg.trim();if(y<50){pages.push([]);y=height-45}pages[pages.length-1].push({text:seg,y});y-=15}}
const objects=[];const add=s=>(objects.push(s),objects.length);const catalog=add('');const pagesObj=add('');const font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');const kids=[];for(const linesPage of pages){const content='BT /F1 10 Tf '+linesPage.map(l=>'1 0 0 1 '+margin+' '+l.y+' Tm ('+pdfstr(l.text)+') Tj').join('\n')+' ET';const stream=add('<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');const page=add('<< /Type /Page /Parent '+pagesObj+' 0 R /MediaBox [0 0 '+paper+' '+height+'] /Resources << /Font << /F1 '+font+' 0 R >> >> /Contents '+stream+' 0 R >>');kids.push(page)}objects[catalog-1]='<< /Type /Catalog /Pages '+pagesObj+' 0 R >>';objects[pagesObj-1]='<< /Type /Pages /Count '+kids.length+' /Kids ['+kids.map(k=>k+' 0 R').join(' ')+'] >>';let output='%PDF-1.4\n%\xD0\xD4\xC5\xD8\n',offset=[0];for(let i=0;i<objects.length;i++){offset.push(output.length);output+=(i+1)+' 0 obj\n'+objects[i]+'\nendobj\n'}const start=output.length;output+='xref\n0 '+(objects.length+1)+'\n0000000000 65535 f \n';for(let i=1;i<offset.length;i++)output+=String(offset[i]).padStart(10,'0')+' 00000 n \n';output+='trailer\n<< /Size '+(objects.length+1)+' /Root '+catalog+' 0 R >>\nstartxref\n'+start+'\n%%EOF';return new Uint8Array([...output].map(c=>c.charCodeAt(0)&255))}

// Langzeit-Auswertung über alle gespeicherten Einsätze und Übungen; nur abgeschlossene Flüge.
let analyticsFilter={drone:'all',battery:'all',from:'',to:''};
function analyticsFlights(){
 return db.operations.flatMap(o=>(o.flights||[]).filter(f=>f.endedAt&&f.startBattery!=null&&f.endBattery!=null&&f.startedAt!=null&&Number(f.endedAt)>Number(f.startedAt)).map(f=>({...f,opName:o.name||o.type,opType:o.type})));
}
function analyticsKey(f){return String(f.droneId||f.droneName)+'::'+String(f.batterySerial||f.battery)}
function analyticsFiltered(){
 return analyticsFlights().filter(f=>(analyticsFilter.drone==='all'||String(f.droneId||f.droneName)===analyticsFilter.drone)&&(analyticsFilter.battery==='all'||analyticsKey(f)===analyticsFilter.battery)&&(!analyticsFilter.from||new Date(f.startedAt).toISOString().slice(0,10)>=analyticsFilter.from)&&(!analyticsFilter.to||new Date(f.startedAt).toISOString().slice(0,10)<=analyticsFilter.to)).sort((a,b)=>a.startedAt-b.startedAt);
}
function analyticsSet(k,v){analyticsFilter[k]=v;if(k==='drone')analyticsFilter.battery='all';batteryAnalytics($('main'))}
function analyticsSeries(f){
 const raw=plotPoints(f).filter(p=>Number.isFinite(p.minute)&&Number.isFinite(p.battery)).map(p=>({minute:p.minute,battery:p.battery}));
 raw.push({minute:0,battery:Number(f.startBattery)},{minute:(f.endedAt-f.startedAt)/60000,battery:Number(f.endBattery)});
 const pts=new Map();for(const p of raw)pts.set(Math.round(p.minute*1000)/1000,Math.max(0,Math.min(100,p.battery)));
 return [...pts].sort((a,b)=>a[0]-b[0]).map(([minute,battery])=>({minute,battery}));
}
function analyticsAt(pts,t){if(!pts.length||t<pts[0].minute||t>pts[pts.length-1].minute)return null;for(let i=1;i<pts.length;i++)if(t<=pts[i].minute){let a=pts[i-1],b=pts[i];return b.minute===a.minute?b.battery:a.battery+(b.battery-a.battery)*(t-a.minute)/(b.minute-a.minute)}return pts[0].battery}
function analyticsChart(flights){
 const W=640,H=320,L=52,R=18,T=22,B=52,w=W-L-R,h=H-T-B;
 const items=flights.map(f=>({f,pts:analyticsSeries(f)})).filter(x=>x.pts.length>=2);
 const max=Math.max(1,...items.map(x=>x.pts[x.pts.length-1].minute));
 const x=t=>L+w*t/max,y=p=>T+h*(100-p)/100;
 let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Langzeit-Akkukurven und Mittelwert" style="width:100%;height:auto;background:#fff">`;
 for(let n=0;n<=100;n+=20){svg+=`<line x1="${L}" y1="${y(n)}" x2="${W-R}" y2="${y(n)}" stroke="#dbe2eb"/><text x="${L-8}" y="${y(n)+4}" text-anchor="end" font-size="12" fill="#536579">${n}%</text>`}
 for(let n=0;n<=4;n++){const m=max*n/4;svg+=`<text x="${x(m)}" y="${H-25}" text-anchor="middle" font-size="12" fill="#536579">${m.toFixed(0)}</text>`}
 svg+=`<text x="${W/2}" y="${H-5}" text-anchor="middle" font-size="13" fill="#536579">Flugzeit (Minuten)</text>`;
 const palette=['#2a6fbe','#cf6037','#8052b6','#0b8673','#aa486d','#8b712c'];
 items.forEach((it,i)=>{const pts=it.pts;svg+=`<polyline fill="none" stroke="${palette[i%palette.length]}" stroke-opacity=".32" stroke-width="1.6" points="${pts.map(p=>x(p.minute).toFixed(1)+','+y(p.battery).toFixed(1)).join(' ')}"/>`});
 const mean=[];for(let m=0;m<=Math.ceil(max);m++){const values=items.map(it=>analyticsAt(it.pts,m)).filter(v=>v!==null);if(values.length)mean.push({minute:m,battery:values.reduce((a,b)=>a+b,0)/values.length})}
 if(mean.length>1)svg+=`<polyline fill="none" stroke="#17263d" stroke-width="4" points="${mean.map(p=>x(p.minute).toFixed(1)+','+y(p.battery).toFixed(1)).join(' ')}"/>`;
 return svg+'</svg>';
}
function batteryAnalytics(el){
 setTitle('Akku-Langzeitauswertung','Alle Einsätze und Übungsflüge');
 const all=analyticsFlights(),drones=[...new Map(all.map(f=>[String(f.droneId||f.droneName),f.droneName])).entries()];
 const relevant=all.filter(f=>analyticsFilter.drone==='all'||String(f.droneId||f.droneName)===analyticsFilter.drone);
 const batteries=[...new Map(relevant.map(f=>[analyticsKey(f),`${f.droneName} · Akku ${f.battery}${f.batterySerial?' · SN '+f.batterySerial:''}`])).entries()];
 const flights=analyticsFiltered(),durations=flights.map(f=>(f.endedAt-f.startedAt)/60000),average=durations.length?durations.reduce((a,b)=>a+b,0)/durations.length:0;
 const drains=flights.map(f=>({f,rate:(Number(f.startBattery)-Number(f.endBattery))/((f.endedAt-f.startedAt)/60000)})).filter(x=>Number.isFinite(x.rate)&&x.rate>0);
 const half=Math.floor(drains.length/2),early=drains.slice(0,half),late=drains.slice(half);
 const mean=a=>a.length?a.reduce((sum,x)=>sum+x.rate,0)/a.length:0;
 const change=half>=3?((mean(late)/mean(early)-1)*100):null;
 el.innerHTML=`<button class="secondary full" onclick="go('history')">← Datenübersicht</button><div class="panel"><h3>Filter</h3><label>Drohne</label><select onchange="analyticsSet('drone',this.value)"><option value="all">Alle Drohnen</option>${drones.map(([id,name])=>`<option value="${esc(id)}" ${analyticsFilter.drone===id?'selected':''}>${esc(name)}</option>`).join('')}</select><label>Akku / Seriennummer</label><select onchange="analyticsSet('battery',this.value)"><option value="all">Alle Akkus</option>${batteries.map(([id,name])=>`<option value="${esc(id)}" ${analyticsFilter.battery===id?'selected':''}>${esc(name)}</option>`).join('')}</select><div class="grid2"><div><label>Von</label><input type="date" value="${esc(analyticsFilter.from)}" onchange="analyticsSet('from',this.value)"></div><div><label>Bis</label><input type="date" value="${esc(analyticsFilter.to)}" onchange="analyticsSet('to',this.value)"></div></div></div><div class="panel"><h3>Langzeit-Statistik</h3><div class="dashboardstat"><div><strong>${flights.length}</strong><span class="micro muted">Flüge</span></div><div><strong>${average.toFixed(1)}</strong><span class="micro muted">Ø Flugminuten</span></div></div>${change===null?'<p class="hint">Für einen Vergleich der frühen und späten Flüge sind mindestens sechs verwertbare Flüge nötig.</p>':`<p><b>Veränderung des Akkuverbrauchs:</b> ${change>=0?'+':''}${change.toFixed(1)} % pro Minute (späte gegenüber frühen Flügen).</p><p class="hint">Positive Werte bedeuten höheren Verbrauch, sind aber kein Beweis für Akkuverschleiß.</p>`}<p class="hint">Nur abgeschlossene Flüge mit Start- und Endwerten. Mittelwertkurve: arithmetischer Mittelwert der jeweils noch fliegenden Akkus pro Flugminute. Temperatur, Wind und Flugprofil beeinflussen die Ergebnisse.</p></div><div class="panel"><h3>📈 Akku (%) nach Flugminuten</h3>${flights.length?analyticsChart(flights):'<p class="muted">Noch keine passenden Flugdaten vorhanden.</p>'}<p class="hint">Farbige Linien: einzelne Flüge · dunkel: Mittelwert. Geschätzte Zwischenwerte sind in den Kurven enthalten.</p><button class="outline full" onclick="analyticsCsv()">Langzeitdaten als CSV exportieren</button></div><div class="panel"><h3>Einzelne Flüge</h3>${flights.slice().reverse().map(f=>`<div class="rowitem"><b>${esc(f.droneName)} · Akku ${esc(f.battery)}</b>${f.batterySerial?`<div class="micro">SN: ${esc(f.batterySerial)}</div>`:''}<div class="micro muted">${dt(f.startedAt)} · ${((f.endedAt-f.startedAt)/60000).toFixed(1)} Min. · ${f.startBattery}% → ${f.endBattery}%</div></div>`).join('')||'Keine passenden Flüge.'}</div>`;
}
function analyticsCsv(){
 const rows=[['Einsatz','Art','Datum','Drohne','Akku','Seriennummer','Flugminuten','Start %','Ende %','Verbrauch % pro Minute']];
 for(const f of analyticsFiltered()){const mins=(f.endedAt-f.startedAt)/60000;rows.push([f.opName,f.opType,dt(f.startedAt),f.droneName,f.battery,f.batterySerial||'',mins.toFixed(2),f.startBattery,f.endBattery,((f.startBattery-f.endBattery)/mins).toFixed(3)])}
 window.exportBytes=new TextEncoder().encode('\ufeff'+csv(rows));window.exportName='Akku_Langzeitauswertung.csv';window.exportMime='text/csv';downloadExport();
}

function chartDataByDrone(o){const grouped=new Map();for(const f of o.flights){const key=f.droneId||f.droneName;if(!grouped.has(key))grouped.set(key,{name:f.droneName,flights:[]});grouped.get(key).flights.push(f)}return [...grouped.values()]}
function estimatedReadings(f){const interval=Math.max(1,Number(f.interval)||1)*60000;const measured=[...(f.readings||[])].filter(r=>Number.isFinite(Number(r.battery))&&Number.isFinite(Number(r.time))).map(r=>({time:Number(r.time),battery:Number(r.battery),estimated:false}));if(f.endedAt!=null&&f.endBattery!=null)measured.push({time:Number(f.endedAt),battery:Number(f.endBattery),estimated:false});measured.sort((a,b)=>a.time-b.time);const estimates=[];for(let i=1;i<measured.length;i++){const prev=measured[i-1],next=measured[i];if(next.time<=prev.time)continue;let slot=Math.floor((prev.time-f.startedAt)/interval)+1;for(let t=f.startedAt+slot*interval;t<next.time;t+=interval){if(t<=prev.time||t>=next.time)continue;const v=prev.battery+(next.battery-prev.battery)*(t-prev.time)/(next.time-prev.time);estimates.push({time:t,battery:Math.round(v*10)/10,type:'Geschätzt (linear)',estimated:true})}}return estimates}
function plotPoints(f){const readings=(f.readings||[]).filter(r=>Number.isFinite(Number(r.battery))).map(r=>({minute:Math.max(0,(r.time-f.startedAt)/60000),battery:Number(r.battery)}));if(f.endedAt!=null&&f.endBattery!=null)readings.push({minute:Math.max(0,(f.endedAt-f.startedAt)/60000),battery:Number(f.endBattery)});for(const r of estimatedReadings(f))readings.push({minute:Math.max(0,(r.time-f.startedAt)/60000),battery:r.battery,estimated:true});return readings.sort((a,b)=>a.minute-b.minute)}
const CHART_COLORS=['#1d67e9','#d55f20','#09886a','#9136b5','#bd3755','#705a13','#4f677e','#438e20'];
function svgDroneChart(group){const W=560,H=280,L=54,R=18,T=18,B=47,w=W-L-R,h=H-T-B,items=group.flights.map((f,i)=>({f,pts:plotPoints(f),col:CHART_COLORS[i%CHART_COLORS.length]})),maxMinute=Math.max(1,...items.flatMap(z=>z.pts.map(p=>p.minute))),x=m=>L+(m/maxMinute)*w,y=b=>T+(100-b)/100*h;let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Akkustand von ${esc(group.name)} über Flugzeit"><rect width="${W}" height="${H}" fill="#f8faff"/>`;for(let pct=0;pct<=100;pct+=25){let v=y(pct);s+=`<line x1="${L}" x2="${W-R}" y1="${v}" y2="${v}" stroke="#d7e1ee" stroke-dasharray="3 4"/><text x="${L-9}" y="${v+4}" text-anchor="end" font-size="13" fill="#57677b">${pct}%</text>`}for(let i=0;i<=4;i++){const mx=maxMinute*i/4,px=x(mx);s+=`<line x1="${px}" x2="${px}" y1="${T+h}" y2="${T+h+5}" stroke="#66788b"/><text x="${px}" y="${T+h+20}" text-anchor="middle" font-size="12" fill="#526479">${mx.toFixed(mx<10?1:0)}</text>`}s+=`<text x="${W/2}" y="${H-4}" text-anchor="middle" font-size="13" fill="#526479">Flugzeit (Minuten)</text><line x1="${L}" x2="${W-R}" y1="${T+h}" y2="${T+h}" stroke="#66788b"/>`;for(const item of items){if(!item.pts.length)continue;for(let i=1;i<item.pts.length;i++){const a=item.pts[i-1],b=item.pts[i];s+=`<line x1="${x(a.minute).toFixed(1)}" y1="${y(a.battery).toFixed(1)}" x2="${x(b.minute).toFixed(1)}" y2="${y(b.battery).toFixed(1)}" stroke="${item.col}" stroke-width="3" ${a.estimated||b.estimated?'stroke-dasharray="5 4"':''}/>`}for(const p of item.pts)s+=`<circle cx="${x(p.minute).toFixed(1)}" cy="${y(p.battery).toFixed(1)}" r="3.7" fill="${p.estimated?'white':item.col}" stroke="${item.col}"/>`}return s+'</svg>'}
function droneChartsHTML(o){return chartDataByDrone(o).map(g=>`<div class="panel"><h3>📊 ${esc(g.name)}</h3><p class="micro muted">Waagerecht: Flugzeit (Min.) · Senkrecht: Flugakku (%) · gestrichelt = geschätzt</p><div class="chartbox">${svgDroneChart(g)}</div><div class="micro">${g.flights.map((f,i)=>`<span class="pillqual" style="border-left:5px solid ${CHART_COLORS[i%CHART_COLORS.length]}">Flug ${o.flights.indexOf(f)+1} · Akku ${esc(f.battery)}</span>`).join('')}</div></div>`).join('')||'<p class="hint">Noch keine Flug- und Akkudaten für Diagramme vorhanden.</p>'}
function reportview(el){const o=opById(current);if(!o)return go('home');setTitle('Gesamtbericht',o.type+' · '+(o.name||o.place||'ohne Bezeichnung'));el.innerHTML=`<div class="panel"><h3>${esc(o.type)}: ${esc(o.name||'Ohne Bezeichnung')}</h3><p>${esc(o.place||'Ort nicht angegeben')}</p><p class="micro muted">${dt(o.startedAt)} · ${o.flights.length} Flüge</p><button class="full" onclick="downloadOpPdf()">📄 Gesamtbericht als PDF (mit Diagrammen)</button><button class="secondary full" onclick="downloadOpCsv()">▤ Gesamtbericht als Excel-CSV</button><p class="hint">Akkuverläufe als Diagramme je Drohne. Alle Flugzeiten, Besatzungen, Fernbedienungswerte und Zwischenstände sind Teil des Berichts.</p><p class="warning">Hinweis: PDF und CSV werden über den nativen Android-Speicherdialog ausgegeben; Standortkarte benötigt eine Internetverbindung.</p></div>${droneChartsHTML(o)}<div class="panel"><h3>Berichtsvorschau</h3>${o.flights.map((f,i)=>`<div class="rowitem"><b>Flug ${i+1}: ${esc(f.droneName)}</b><p class="micro">${dt(f.startedAt)} – ${dt(f.endedAt)} · Akku ${esc(f.battery)} · Pilot ${esc(f.pilot)}<br>Flugakku ${f.startBattery}% → ${f.endBattery??'-'}% | Fernbedienung ${f.startRc}% → ${f.endRc??'-'}%<br>Flugzeit ${flightMinutes(f.startedAt,f.endedAt)} · ${(f.readings||[]).length} Akku-Messwerte</p></div>`).join('')||'Noch keine Flüge dokumentiert.'}</div><button class="secondary full" onclick="go('operation')">← Zur Einsatzübersicht</button>`}
function downloadOpCsv(){const o=opById(current);if(!o)return;let data=csv(csvReportRows(o));showData('Einsatzbericht_'+o.id+'.csv',data,'text/csv;charset=utf-8')}
function makePdfChartReport(lines,o){const paper=595,height=842,left=48,bottom=160,chartW=495,chartH=355;
 let paragraphs=[];function norm(s){return String(s??'').replace(/[\r\n]+/g,' ').replace(/[\u2013\u2014]/g,'-').replace(/[^\x20-\xFF]/g,'?')};function ps(s){return norm(s).replace(/[\\()]/g,'\\$&')};
 let y=774,cur=[];for(const line of lines){const tokens=norm(line).match(/.{1,95}(?:\s|$)|\S{1,95}/g)||[''];for(const item of tokens){if(y<55){paragraphs.push(cur);cur=[];y=774}cur.push({text:item.trim(),y});y-=15}}paragraphs.push(cur);
 const objects=[], add=s=>(objects.push(s),objects.length),root=add(''),pagesRoot=add(''),font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'),pages=[];
 const page=(content)=>{const stream=add('<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');const pageNum=add('<< /Type /Page /Parent '+pagesRoot+' 0 R /MediaBox [0 0 '+paper+' '+height+'] /Resources << /Font << /F1 '+font+' 0 R >> >> /Contents '+stream+' 0 R >>');pages.push(pageNum)};
 for(const pg of paragraphs){const logo='1 0.08 0.08 rg 38 804 70 27 re f 1 1 1 RG 1.5 w 40 806 66 23 re S 1 1 1 RG 2 w 40 807 m 106 828 l S 1 1 1 rg 50 822 m 72 813 l 94 822 l 94 817 l 72 809 l 50 817 h f';page(logo+'\nBT /F1 10 Tf '+pg.map(q=>'1 0 0 1 38 '+q.y+' Tm ('+ps(q.text)+') Tj').join('\n')+' ET')}
 for(const group of chartDataByDrone(o)){
   const X=left,Y=bottom,W=chartW,H=chartH,maxMinute=Math.max(1,...group.flights.flatMap(f=>plotPoints(f).map(p=>p.minute)));let commands=[];
   const line=(a,b,c,d)=>commands.push(`${a.toFixed(2)} ${b.toFixed(2)} m ${c.toFixed(2)} ${d.toFixed(2)} l S`);
   const label=(s,x,y,size=10)=>{commands.push(`BT /F1 ${size} Tf 1 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)} Tm (${ps(s)}) Tj ET`)};
   label('Akkuverlauf: '+group.name,48,750,17);label('X: Flugzeit (Minuten)     Y: Flugakku (%)',48,723,11);
   commands.push('0.75 0.79 0.84 RG 0.6 w');
   for(let pct=0;pct<=100;pct+=25){const yy=Y+H*pct/100;line(X,yy,X+W,yy);label(pct+'%',10,yy-4,10)}
   for(let i=0;i<=5;i++){const t=maxMinute*i/5,xx=X+W*i/5;line(xx,Y,xx,Y-5);label(t.toFixed(1),xx-6,Y-25,9)}
   const cols=[[0.10,0.40,0.91],[0.83,0.37,0.13],[0.05,0.52,0.39],[0.58,0.21,0.72],[0.72,0.20,0.30]];
   for(let j=0;j<group.flights.length;j++){const f=group.flights[j],points=plotPoints(f),col=cols[j%cols.length];commands.push(`${col.join(' ')} RG 2.2 w`);for(let i=1;i<points.length;i++)line(X+W*points[i-1].minute/maxMinute,Y+H*points[i-1].battery/100,X+W*points[i].minute/maxMinute,Y+H*points[i].battery/100);label('Flug '+(o.flights.indexOf(f)+1)+' / Akku '+f.battery,48,620-(j*17),10)}
   page(commands.join('\n'));
 }
 objects[root-1]='<< /Type /Catalog /Pages '+pagesRoot+' 0 R >>';objects[pagesRoot-1]='<< /Type /Pages /Count '+pages.length+' /Kids ['+pages.map(p=>p+' 0 R').join(' ')+'] >>';let output='%PDF-1.4\n%\xD0\xD4\xC5\xD8\n',offsets=[0];for(let i=0;i<objects.length;i++){offsets.push(output.length);output+=(i+1)+' 0 obj\n'+objects[i]+'\nendobj\n'}const xref=output.length;output+='xref\n0 '+(objects.length+1)+'\n0000000000 65535 f \n';for(let i=1;i<offsets.length;i++)output+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';output+='trailer\n<< /Size '+(objects.length+1)+' /Root '+root+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';return new Uint8Array([...output].map(ch=>ch.charCodeAt(0)&255));
}
function downloadOpPdf(){const o=opById(current);if(!o)return;const bytes=makePdfChartReport(reportLines(o),o);window.exportBytes=bytes;window.exportName='Einsatzbericht_'+o.id+'.pdf';window.exportMime='application/pdf';modal(`<h3>PDF-Gesamtbericht</h3><p>${o.flights.length} Flüge · vollständiger Bericht</p><p class="hint">PDF enthält jetzt Diagramme je Drohne. Über den Android-Dateidialog speichern, alternativ Berichttext kopieren.</p><button class="full" onclick="downloadExport()">PDF speichern</button><button class="secondary full" onclick="copyExport()">Berichttext kopieren</button><label>Berichttext</label><textarea id="exportText" style="height:150px" readonly>${esc(reportLines(o).join('\n'))}</textarea><button class="secondary full" onclick="closeModal()">Schließen</button>`)}

function csv(rows){return '\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n')}
function getExport(type){let rows;if(type==='flights'){rows=[['Vorgang','Art','Ort','Flug-ID','Drohne','Akku','Akku-Seriennummer','Pilot','Co-Pilot','Protokollführer','Start','Ende','Dauer Minuten','Flugakku Start %','Flugakku Ende %','Fernbedienung Start %','Fernbedienung Ende %','Temperatur C','Bemerkung']];for(const o of db.operations)for(const f of o.flights)rows.push([o.name,o.type,o.place,f.id,f.droneName,f.battery,f.batterySerial||'',f.pilot,f.copilot,f.recorder,dt(f.startedAt),dt(f.endedAt),f.endedAt?minutesCsv(f.startedAt,f.endedAt):'',f.startBattery,f.endBattery,f.startRc,f.endRc,o.temp,f.note]);}else if(type==='readings'){rows=[['Vorgang','Drohne','Akku','Flug-ID','Flugminute (MM:SS)','Uhrzeit','Typ','Flugakku %']];for(const o of db.operations)for(const f of o.flights)for(const r of f.readings)rows.push([o.name||o.type,f.droneName,f.battery,f.id,flightOffset(f,r.time),dt(r.time),r.type,r.battery]);}else if(type==='audit'){rows=[['Zeit','Änderung','Vorgang-ID','Person','Bemerkung','Vorher','Nachher']];for(const a of db.audit)rows.push([dt(a.time),a.type,a.op,a.person,a.note,a.before,a.after]);}return csv(rows)}
function exportscreen(el){setTitle('Daten exportieren','Excel-kompatible CSV-Dateien');el.innerHTML=`<div class="panel"><h3>Export</h3><p>Die Werte werden als CSV-Dateien zusammengestellt, die Excel öffnen kann.</p><button class="full" onclick="exportCsv('flights')">Flugübersicht (CSV)</button><button class="secondary full" onclick="exportCsv('readings')">Akku-Zwischenstände (CSV)</button><button class="secondary full" onclick="exportCsv('audit')">Änderungshistorie (CSV)</button></div><div class="panel"><h3>Sicherung</h3><p class="hint">Vollständiges Daten-Backup als JSON. Bewahre es geschützt auf, nicht in einem öffentlich zugänglichen Drive-Ordner.</p><button class="outline full" onclick="backupData()">Backup anzeigen / kopieren</button><button class="secondary full" onclick="importData()">Backup wiederherstellen</button></div><div class="warning">Nutze den Android-Dateidialog, um PDF/CSV lokal oder direkt in Google Drive zu speichern.</div>`}
function exportCsv(type){const s=getExport(type);const name='Drohnen_'+type+'_'+new Date().toISOString().slice(0,10)+'.csv';showData(name,s,'text/csv;charset=utf-8')}
function backupData(){showData('Drohnengruppe_Backup.json',JSON.stringify(db,null,2),'application/json')}
function showData(name,data,mime){window.exportData=data;window.exportBytes=null;window.exportName=name;window.exportMime=mime;modal(`<h3>Export: ${esc(name)}</h3><p class="hint">„Datei speichern“ oder als Alternative Text kopieren.</p><div class="grid2"><button onclick="downloadExport()">Datei speichern</button><button class="secondary" onclick="copyExport()">Text kopieren</button></div><label>Exportdaten</label><textarea id="exportText" style="height:180px" readonly>${esc(data)}</textarea><button class="secondary full" onclick="closeModal()">Schließen</button>`)}
function downloadExport(){try{if(window.NativeBridge&&typeof NativeBridge.saveFile==='function'){
  const bytes=window.exportBytes instanceof Uint8Array?window.exportBytes:new TextEncoder().encode(String(window.exportData||''));
  let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
  NativeBridge.saveFile(String(window.exportName),String(window.exportMime).split(';')[0],btoa(binary));
  toast('Android-Speicherdialog wird geöffnet …');return;
 }const b=new Blob([window.exportBytes||window.exportData],{type:window.exportMime});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=window.exportName;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15000);toast('Download versucht. Falls keine Datei erscheint: Android-WebView unterstützt den Export noch nicht.')}catch(e){toast('Dateidownload nicht verfügbar: '+e.message)} }
function copyExport(){const a=$('exportText');a.select();a.setSelectionRange(0,a.value.length);try{if(document.execCommand('copy'))toast('In Zwischenablage kopiert');else toast('Text bitte manuell kopieren')}catch(e){toast('Text bitte manuell kopieren')}}
function importData(){modal(`<h3>Backup wiederherstellen</h3><p class="warning">Die aktuellen Daten werden ersetzt. Nur Backups aus vertrauenswürdiger Quelle importieren.</p><textarea id="restore" placeholder="Backup-JSON hier einfügen"></textarea><label>PIN zur Bestätigung</label><input id="restorePin" type="password" inputmode="numeric"><div class="grid2" style="margin-top:15px"><button class="secondary" onclick="closeModal()">Abbrechen</button><button class="danger" onclick="restoreBackup()">Wiederherstellen</button></div>`)}
function restoreBackup(){if($('restorePin').value!==db.pin)return toast('PIN falsch');try{const x=JSON.parse($('restore').value);if(!Array.isArray(x.operations)||!Array.isArray(x.drones)||!Array.isArray(x.people)||typeof x.pin!=='string')throw Error('Ungültiges Format');db=x;save();closeModal();go('home');toast('Backup wiederhergestellt')}catch(e){toast('Import fehlgeschlagen: '+e.message)}}
window.reminderUntil={};window.activeReminderKey='';window.readingTarget=null;
function tick(){
 if(view==='flight'){
  const o=opById(current),f=o?.flights.find(x=>x.id===flightId);
  if(f){const t=$('flighttime');if(t)t.textContent=duration(f.startedAt,f.endedAt);
    const v=$('nextreading');if(v&&!f.endedAt){const d=dueInfo(f);v.textContent=d.text;v.className='bigcount '+d.color;}}
 }
 if(view==='operation'){
  const o=opById(current);if(o)for(const f of o.flights.filter(x=>!x.endedAt)){
   const n=$('due-'+f.id);if(n){const d=dueInfo(f);n.textContent=d.text;n.closest('.liveitem').className='liveitem '+d.color;const clock=$('flight-'+f.id);if(clock)clock.textContent='Flugzeit '+duration(f.startedAt);}
  }
 }
 // The first due active flight receives a visible popup. An already open form is never overwritten.
 if($('modalroot').firstElementChild)return;
 for(const o of db.operations.filter(x=>!x.endedAt))for(const f of o.flights.filter(x=>!x.endedAt)){
   const due=readingDue(f),key=f.id+':'+due;
   if(now()>=due && now()>=(window.reminderUntil[key]||0)){
      window.activeReminderKey=key;
      recordBattery(o.id,f.id,true);
      try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=720;gain.gain.value=.045;osc.start();osc.stop(ctx.currentTime+.15);setTimeout(()=>ctx.close(),350)}catch(e){}
      return;
   }
 }
}
setInterval(tick,1000);render();setTimeout(syncNativeReminders,500);
</script></body></html>
